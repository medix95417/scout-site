{{define "content"}}
  <h1 class="text-2xl font-bold mb-6">Two-Factor Verification</h1>
  <form method="post" action="/login/2fa" class="max-w-sm space-y-4">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
      <label class="block text-sm font-medium mb-1" for="code">Code</label>
      <input class="w-full rounded-md border border-gray-300 px-3 py-2 tracking-widest" type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required autofocus>
      <p class="text-xs text-gray-500 mt-1">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
    </div>
    <button type="submit" class="rounded-md px-4 py-2 btn-accent">
      Verify
    </button>
  </form>
{{end}}
