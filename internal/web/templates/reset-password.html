{{define "content"}}
  <h1 class="text-2xl font-bold mb-6">Set a New Password</h1>
  <form method="post" action="/reset-password" class="max-w-sm space-y-4">
    <input type="hidden" name="token" value="{{.Token}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
      <label class="block text-sm font-medium mb-1" for="password">New password</label>
      <input class="w-full rounded-md border border-gray-300 px-3 py-2" type="password" id="password" name="password" minlength="8" required autofocus>
      <p class="text-xs text-gray-500 mt-1">At least 8 characters, with a mix of at least 3 of: lowercase, uppercase, numbers, symbols.</p>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password_confirm">Confirm new password</label>
      <input class="w-full rounded-md border border-gray-300 px-3 py-2" type="password" id="password_confirm" name="password_confirm" minlength="8" required>
    </div>
    <button type="submit" class="rounded-md px-4 py-2 btn-accent">
      Set Password
    </button>
    <p class="text-xs text-gray-500">
      Link expired or not working? <a href="/forgot-password" class="underline" style="color: var(--unit-color);">Request a new one</a>.
    </p>
  </form>
{{end}}
