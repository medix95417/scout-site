{{define "content"}}
  <p class="mb-4"><a href="/news" class="text-sm underline" style="color: var(--unit-color);">&larr; Back to News</a></p>
  <article class="rounded-lg border border-gray-200 bg-white p-6">
    <div class="text-xs text-gray-400 mb-2">{{.PostedOn}}</div>
    <h1 class="text-2xl font-bold mb-4">{{.Title}}</h1>
    <p class="text-gray-700 leading-relaxed whitespace-pre-line">{{.Body}}</p>
  </article>
{{end}}
