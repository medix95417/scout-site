{{define "content"}}
  <h1 class="text-2xl font-bold mb-6">News — {{.Unit.Name}}</h1>

  {{if .Items}}
    <div class="space-y-4">
      {{range .Items}}
        <a href="/news/{{.ID}}" class="block rounded-lg border border-gray-200 bg-white p-4 hover:border-gray-300">
          <div class="text-xs text-gray-400 mb-1">{{.PostedOn}}</div>
          <h2 class="text-lg font-semibold mb-1" style="color: var(--unit-color);">{{.Title}}</h2>
          {{if .Excerpt}}<p class="text-sm text-gray-600">{{.Excerpt}}</p>{{end}}
        </a>
      {{end}}
    </div>
  {{else}}
    <p class="text-sm text-gray-500">No news posted yet.</p>
  {{end}}
{{end}}
