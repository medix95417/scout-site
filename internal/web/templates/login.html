{{define "content"}}
  <h1 class="text-2xl font-bold mb-6">Log in</h1>
  <form method="post" action="/login" class="max-w-sm space-y-4">
    <input type="hidden" name="next" value="{{.Next}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input class="w-full rounded-md border border-gray-300 px-3 py-2" type="email" id="email" name="email" required autofocus>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Password</label>
      <input class="w-full rounded-md border border-gray-300 px-3 py-2" type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="rounded-md px-4 py-2 btn-accent">
      Log in
    </button>
    <p class="text-sm">
      <a href="/forgot-password" class="underline" style="color: var(--unit-color);">Forgot your password?</a>
    </p>
    <p class="text-xs text-gray-500">
      One family account works across both {{.Unit.Name}} and our sibling unit's site — you don't need a
      separate login for each.
    </p>
  </form>
{{end}}
