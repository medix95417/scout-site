{{define "content"}}
  <h1 class="text-2xl font-bold mb-6">Forgot Password</h1>

  {{if .Submitted}}
    <div class="max-w-sm rounded-lg border border-gray-200 bg-white p-4 text-sm">
      <p>If that email has an account, we've sent a link to reset the password. It's valid for about an hour.</p>
      <p class="mt-3"><a href="/login" class="underline" style="color: var(--unit-color);">Back to log in</a></p>
    </div>
  {{else}}
    <form method="post" action="/forgot-password" class="max-w-sm space-y-4">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div>
        <label class="block text-sm font-medium mb-1" for="email">Email</label>
        <input class="w-full rounded-md border border-gray-300 px-3 py-2" type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="rounded-md px-4 py-2 text-white" style="background-color: var(--accent-color);">
        Send Reset Link
      </button>
      <p class="text-xs text-gray-500">
        Remembered it? <a href="/login" class="underline" style="color: var(--unit-color);">Log in</a> instead.
      </p>
    </form>
  {{end}}
{{end}}
