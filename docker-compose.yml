# The ONE file for both local development and production (a VPS) — see
# README.md "Running with Docker Compose" (local) and "Running on a VPS"
# (production). Everything that differs between the two environments comes
# from .env, not from a second compose file:
#   - locally: leave POSTGRES_PASSWORD/COOKIE_DOMAIN at their defaults
#   - on a VPS: set a real POSTGRES_PASSWORD, SESSION_SECRET, and
#     COOKIE_DOMAIN=.47-yonkers.org so Caddy's certificates and the shared
#     login cookie both work against real DNS.
#
# The `caddy` service only does something useful once real DNS points at
# this host — locally, just talk to the `app` service on localhost:8080
# (see README for the /etc/hosts-based approach to testing both subdomains
# locally without Caddy).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoutsite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoutsite}
      POSTGRES_DB: scoutsite
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost only — never exposed to the public internet, even on a VPS
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutsite"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-scoutsite}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-scoutsite-dev-key}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000" # localhost only — the app talks to MinIO over the compose network; this port is just for local debugging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Passed as separate pieces, not a pre-built DATABASE_URL — a
      # POSTGRES_PASSWORD generated with `openssl rand -base64 N` can
      # contain a "/", which breaks a hand-spliced postgres:// URL's
      # parsing (docker-compose does no URL-escaping on substitution).
      # internal/config.Load builds the connection string itself via
      # net/url, which escapes correctly no matter what character ends up
      # in the password.
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "scoutsite"
      DB_NAME: "scoutsite"
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scoutsite}
      DB_SSLMODE: "disable"
      LISTEN_ADDR: ":8080"
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      REMINDER_WINDOW_HOURS: ${REMINDER_WINDOW_HOURS:-24}
      # File library / event photos (internal/storage) — defaults point at
      # the bundled MinIO service above. Point at a real S3-compatible
      # bucket instead (AWS S3, Cloudflare R2, etc.) by overriding these.
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scoutsite}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-scoutsite-dev-key}
      S3_BUCKET: ${S3_BUCKET:-scoutsite-files}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    ports:
      - "127.0.0.1:8080:8080" # localhost only — the public path is always through Caddy (80/443); this is just for local debugging (curl/SSH tunnel)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TROOP_HOST: ${TROOP_HOST:-troop.47-yonkers.org}
      PACK_HOST: ${PACK_HOST:-pack.47-yonkers.org}

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
