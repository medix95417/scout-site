name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The ledger's guarantees are guarantees about what the database ends
    # up holding — the balance-to-zero rule is enforced partly by a
    # deferred constraint trigger, which no amount of Go-level testing
    # reaches. internal/ledger's tests skip themselves when
    # TEST_DATABASE_URL is unset (so `go test ./...` still works on a
    # laptop with no Postgres), so CI has to provide one or they'd never
    # actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scout_test?sslmode=disable
        run: go test ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the code and its dependencies against the Go vulnerability
      # database (vuln.go.dev). Its own job so a finding shows up as a
      # distinct, clearly-labeled failing check rather than looking like a
      # build/test break. govulncheck reports only vulnerabilities in code
      # paths actually reachable from this module, so a finding here is real,
      # not just "a dependency somewhere has a CVE."
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
