name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The ledger's guarantees are guarantees about what the database ends
    # up holding — the balance-to-zero rule is enforced partly by a
    # deferred constraint trigger, which no amount of Go-level testing
    # reaches. internal/ledger's tests skip themselves when
    # TEST_DATABASE_URL is unset (so `go test ./...` still works on a
    # laptop with no Postgres), so CI has to provide one or they'd never
    # actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scout_test?sslmode=disable
        run: go test ./...

  # Scans the code and its dependencies against the Go vulnerability
  # database (vuln.go.dev). Its own job so a finding shows up as a distinct,
  # clearly-labeled failing check rather than looking like a build/test
  # break. govulncheck reports only vulnerabilities in code paths actually
  # reachable from this module, so a finding here is real, not just "a
  # dependency somewhere has a CVE."
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately equal to the build job's Go version, and see below
      # before changing one without the other.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Pinned rather than @latest — which is what golang/govulncheck-action
      # installs, and why this job no longer uses it. x/vuln v1.8.0 raised
      # its own floor to Go 1.26, so @latest stopped building under the Go
      # pinned above and the job went red on every branch at once, failing
      # while installing the scanner, before it read a line of this repo. A
      # security check that breaks on a date rather than on a finding
      # teaches people to ignore it.
      #
      # Pin the scanner, not the toolchain. Chasing @latest by bumping this
      # job to Go 1.26 looks like the smaller fix and is the wrong one:
      # govulncheck reports standard-library vulnerabilities for the Go it
      # runs under, so scanning on a Go we do not build with would hide real
      # findings against the binary we ship and invent ones we are not
      # exposed to.
      #
      # The cost is a scanner that goes stale quietly, which is the failure
      # this pin can have and the red job could not. Bump it on purpose, and
      # together with the Go version above if that moves.
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: govulncheck
        run: govulncheck ./...
